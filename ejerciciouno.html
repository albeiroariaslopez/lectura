<html lang="es">
<head>
  <meta charset="UTF-8">

  <title>Ejercicio Uno - Flashcards de 3 Letras</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #f8fafc;
      /* Zoom base forzado */
      zoom: 100%;
      -webkit-text-size-adjust: 100%;
    }

    /* Estilos del Contenedor Principal / Tarjeta */
    .card {
      background: #334155;
      padding: 3rem 2.5rem;
      border-radius: 1.5rem;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.4);
      border: 1px solid #475569;
      text-align: center;
      width: 90%;
      max-width: 650px;
    }

    /* Vista 1: Ejercicio de Palabras */
    .word-display {
      font-size: clamp(4rem, 15vw, 8rem);
      font-weight: 800;
      color: #38bdf8;
      letter-spacing: 0.05em;
      min-height: 1.2em;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Animación para el parpadeo de cada palabra */
    .flash {
      animation: flash-anim 0.08s ease-in-out;
    }

    @keyframes flash-anim {
      0% { opacity: 1; }
      50% { opacity: 0; }
      100% { opacity: 1; }
    }

    .timer-bar {
      width: 100%;
      height: 8px;
      background: #1e293b;
      border-radius: 4px;
      margin-top: 2rem;
      overflow: hidden;
    }
    .timer-progress {
      height: 100%;
      background: #38bdf8;
      width: 100%;
      animation: countdown 60s linear forwards;
    }
    @keyframes countdown {
      from { width: 100%; }
      to { width: 0%; }
    }

    /* Vista 2: Formulario y Verificación */
    h2 {
      font-size: 50px;
      margin-bottom: 2rem;
      color: #f1f5f9;
      line-height: 1.4;
    }
    input[type="number"] {
      width: 100%;
      padding: 1rem;
      font-size: 50px;
      border-radius: 0.75rem;
      border: 2px solid #64748b;
      background: #1e293b;
      color: #f8fafc;
      margin-bottom: 1.75rem;
      outline: none;
      text-align: center;
    }
    input[type="number"]:focus {
      border-color: #38bdf8;
    }
    .btn-group {
      display: flex;
      gap: 1.25rem;
      justify-content: center;
    }
    button, .btn {
      font-size: 50px;
      padding: 1rem 2rem;
      border: none;
      border-radius: 0.75rem;
      cursor: pointer;
      font-weight: 700;
      text-decoration: none;
      transition: background 0.2s ease, transform 0.1s ease;
      display: inline-block;
    }
    button:active, .btn:active {
      transform: scale(0.97);
    }
    .btn-submit {
      background: #38bdf8;
      color: #0f172a;
      width: 100%;
    }
    .btn-submit:hover {
      background: #0284c7;
      color: #fff;
    }
    .btn-home {
      background: #475569;
      color: #f8fafc;
      flex: 1;
    }
    .btn-home:hover {
      background: #64748b;
    }
    .btn-repeat {
      background: #e11d48;
      color: #f8fafc;
      flex: 1;
    }
    .btn-repeat:hover {
      background: #be123c;
    }
    .btn-success {
      background: #22c55e;
      color: #0f172a;
      width: 100%;
    }
    .btn-success:hover {
      background: #16a34a;
      color: #fff;
    }
    .hidden {
      display: none !important;
    }
    .error-msg {
      color: #f87171;
      font-size: 40px;
      font-weight: 600;
      margin-bottom: 1rem;
    }
    .success-msg {
      color: #4ade80;
      font-size: 45px;
      font-weight: 700;
      margin-bottom: 1rem;
    }
    .total-info {
      color: #38bdf8;
      font-size: 30px;
      font-weight: 600;
      margin-bottom: 2rem;
    }
  </style>
</head>

    // Iniciar el ciclo de cambio de palabras y temporizador
    function iniciarEjercicio() {
      contadorLeo = 0;
      document.getElementById('exerciseContainer').classList.remove('hidden');

      document.getElementById('errorContainer').classList.add('hidden');

      progress.style.animation = 'none';
      progress.offsetHeight; /* trigger reflow */

        // Trigger del parpadeo rápido

        display.classList.add('flash');

        display.textContent = palabraSeleccionada;

        }
      }, 400);

        document.getElementById('exerciseContainer').classList.add('hidden');
        document.getElementById('formContainer').classList.remove('hidden');
        document.getElementById('userAnswer').focus();
      }, 60000);
    }

        document.getElementById('errorContainer').classList.remove('hidden');
      }
    }
