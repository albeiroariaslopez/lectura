<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ejercicio Uno - Velocidad de Lectura</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; filter: drop-shadow(0 0 15px rgba(59, 130, 246, 0.5)); }
      50% { opacity: 0.15; filter: drop-shadow(0 0 2px rgba(59, 130, 246, 0.1)); }
    }
    .animate-blink {
      animation: blink 0.35s ease-in-out infinite alternate;
    }
    /* Estilo para el slider personalizado */
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      height: 20px;
      width: 20px;
      border-radius: 50%;
      background: #3b82f6;
      cursor: pointer;
      box-shadow: 0 0 10px rgba(59, 130, 246, 0.8);
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between selection:bg-blue-500 selection:text-white">

  <!-- Encabezado y Navegación -->
  <header class="w-full max-w-4xl mx-auto p-4 sm:p-6 flex items-center justify-between border-b border-slate-800">
    <a href="index.html" class="flex items-center gap-2 text-slate-400 hover:text-blue-400 transition-colors duration-200">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/>
      </svg>
      <span class="text-sm font-medium">Volver a Inicio</span>
    </a>
    <h1 class="text-lg sm:text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-indigo-400">
      Ejercicio 1: Parpadeo Focal
    </h1>
    <span id="counter-badge" class="text-xs bg-slate-900 border border-slate-800 px-3 py-1 rounded-full text-slate-400">
      Palabra: <span id="current-index" class="text-blue-400 font-bold">1</span>/<span id="total-words">0</span>
    </span>
  </header>

  <!-- Área Principal de Lectura -->
  <main class="flex-1 flex flex-col items-center justify-center p-4 max-w-3xl mx-auto w-full">
    
    <!-- Contenedor Visual de Palabra -->
    <div class="w-full h-64 sm:h-80 bg-slate-900/60 rounded-2xl border border-slate-800 backdrop-blur-sm flex items-center justify-center p-6 relative shadow-2xl overflow-hidden mb-6">
      <div class="absolute inset-0 bg-gradient-to-b from-blue-500/5 to-transparent pointer-events-none"></div>
      
      <!-- Display de la palabra con efecto animación opcional -->
      <span id="word-display" class="text-4xl sm:text-6xl md:text-7xl font-extrabold tracking-wide text-center text-white transition-all duration-150 transform">
        Cargando...
      </span>
    </div>

    <!-- Panel de Control de Velocidad (WPM & Intervalo) -->
    <div class="w-full bg-slate-900/80 border border-slate-800 rounded-xl p-4 sm:p-5 backdrop-blur shadow-lg mb-6">
      <div class="flex flex-col sm:flex-row items-center justify-between gap-4">
        
        <!-- Info de Velocidad Actual -->
        <div class="flex items-center gap-4 w-full sm:w-auto justify-between sm:justify-start">
          <span class="text-xs uppercase tracking-wider text-slate-400 font-semibold">Velocidad:</span>
          <div class="flex items-center gap-2">
            <span id="wpm-display" class="text-2xl font-bold text-blue-400">300</span>
            <span class="text-xs text-slate-500 font-medium">WPM</span>
            <span class="text-slate-600">|</span>
            <span id="ms-display" class="text-xs text-slate-400 font-mono">200 ms</span>
          </div>
        </div>

        <!-- Slider de Ajuste -->
        <div class="flex-1 w-full max-w-xs flex items-center gap-3">
          <span class="text-xs text-slate-500">Lento</span>
          <input 
            type="range" 
            id="speed-range" 
            min="100" 
            max="1000" 
            step="25" 
            value="300" 
            class="w-full h-2 bg-slate-800 rounded-lg appearance-none cursor-pointer focus:outline-none focus:ring-2 focus:ring-blue-500/50"
          >
          <span class="text-xs text-slate-500">Rápido</span>
        </div>

      </div>
    </div>

    <!-- Botones de Acción / Navegación Interactiva -->
    <div class="flex items-center gap-3 sm:gap-4 flex-wrap justify-center">
      <button id="btn-prev" class="px-5 py-2.5 rounded-xl bg-slate-900 border border-slate-800 text-slate-300 hover:text-white hover:bg-slate-800 active:scale-95 transition duration-150 flex items-center gap-2 font-medium">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
        </svg>
        Anterior
      </button>

      <button id="btn-toggle" class="px-8 py-3 rounded-xl bg-blue-600 hover:bg-blue-500 text-white font-semibold shadow-lg shadow-blue-500/25 active:scale-95 transition duration-150 flex items-center gap-2 text-base">
        <svg id="play-icon" class="w-5 h-5 fill-current" viewBox="0 0 24 24">
          <path d="M8 5v14l11-7z"/>
        </svg>
        <svg id="pause-icon" class="w-5 h-5 fill-current hidden" viewBox="0 0 24 24">
          <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
        </svg>
        <span id="toggle-text">Iniciar</span>
      </button>

      <button id="btn-next" class="px-5 py-2.5 rounded-xl bg-slate-900 border border-slate-800 text-slate-300 hover:text-white hover:bg-slate-800 active:scale-95 transition duration-150 flex items-center gap-2 font-medium">
        Siguiente
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
        </svg>
      </button>

      <button id="btn-blink-toggle" class="px-4 py-2.5 rounded-xl bg-slate-900/80 border border-slate-800 text-slate-400 hover:text-blue-400 transition duration-150 text-xs font-semibold uppercase tracking-wider">
        Efecto Parpadeo: <span id="blink-status" class="text-blue-400">ON</span>
      </button>
    </div>

  </main>

  <!-- Pie de página -->
  <footer class="w-full max-w-4xl mx-auto p-4 text-center text-xs text-slate-600 border-t border-slate-900">
    Módulo de Entrenamiento de Lectura Rápida &copy; 2026
  </footer>

  <!-- Lógica JavaScript -->
  <script>
    // Vocabulario de entrenamiento
    const wordList = [
      "Concentración", "Enfoque", "Velocidad", "Agilidad", "Retención",
      "Comprensión", "Memoria", "Lectura", "Visualización", "Percepción",
      "Fluidez", "Capacidad", "Procesamiento", "Atención", "Estrategia",
      "Entrenamiento", "Rendimiento", "Conocimiento", "Pensamiento", "Destreza"
    ];

    let currentIndex = 0;
    let isPlaying = false;
    let blinkEnabled = true;
    let intervalId = null;
    let wpm = 300; // Palabras por minuto por defecto

    // Elementos DOM
    const wordDisplay = document.getElementById('word-display');
    const currentIndexEl = document.getElementById('current-index');
    const totalWordsEl = document.getElementById('total-words');
    const wpmDisplay = document.getElementById('wpm-display');
    const msDisplay = document.getElementById('ms-display');
    const speedRange = document.getElementById('speed-range');
    const btnToggle = document.getElementById('btn-toggle');
    const btnPrev = document.getElementById('btn-prev');
    const btnNext = document.getElementById('btn-next');
    const btnBlinkToggle = document.getElementById('btn-blink-toggle');
    const blinkStatus = document.getElementById('blink-status');
    const playIcon = document.getElementById('play-icon');
    const pauseIcon = document.getElementById('pause-icon');
    const toggleText = document.getElementById('toggle-text');

    // Inicializar total
    totalWordsEl.textContent = wordList.length;

    // Calcular intervalo en milisegundos desde WPM
    function wpmToMs(wpmValue) {
      return Math.round(60000 / wpmValue);
    }

    // Actualizar pantalla de la palabra
    function renderWord() {
      wordDisplay.textContent = wordList[currentIndex];
      currentIndexEl.textContent = currentIndex + 1;

      // Aplicar o remover efecto de parpadeo
      if (blinkEnabled) {
        wordDisplay.classList.add('animate-blink');
      } else {
        wordDisplay.classList.remove('animate-blink');
      }
    }

    // Avanzar a la siguiente palabra
    function nextWord() {
      if (currentIndex < wordList.length - 1) {
        currentIndex++;
      } else {
        currentIndex = 0; // Reiniciar al finalizar
      }
      renderWord();
    }

    // Retroceder palabra
    function prevWord() {
      if (currentIndex > 0) {
        currentIndex--;
      } else {
        currentIndex = wordList.length - 1;
      }
      renderWord();
    }

    // Iniciar / Pausar reproducción automática
    function togglePlay() {
      isPlaying = !isPlaying;

      if (isPlaying) {
        toggleText.textContent = 'Pausar';
        playIcon.classList.add('hidden');
        pauseIcon.classList.remove('hidden');
        btnToggle.classList.replace('bg-blue-600', 'bg-amber-600');
        btnToggle.classList.replace('hover:bg-blue-500', 'hover:bg-amber-500');
        
        startTimer();
      } else {
        toggleText.textContent = 'Iniciar';
        playIcon.classList.remove('hidden');
        pauseIcon.classList.add('hidden');
        btnToggle.classList.replace('bg-amber-600', 'bg-blue-600');
        btnToggle.classList.replace('hover:bg-amber-500', 'hover:bg-blue-500');
        
        stopTimer();
      }
    }

    function startTimer() {
      stopTimer();
      const ms = wpmToMs(wpm);
      intervalId = setInterval(() => {
        nextWord();
      }, ms);
    }

    function stopTimer() {
      if (intervalId) {
        clearInterval(intervalId);
        intervalId = null;
      }
    }

    // Eventos de control de velocidad
    speedRange.addEventListener('input', (e) => {
      wpm = parseInt(e.target.value, 10);
      const ms = wpmToMs(wpm);
      
      wpmDisplay.textContent = wpm;
      msDisplay.textContent = `${ms} ms`;

      if (isPlaying) {
        startTimer(); // Reiniciar intervalo con la nueva velocidad dinámicamente
      }
    });

    // Eventos de botones
    btnToggle.addEventListener('click', togglePlay);
    btnNext.addEventListener('click', () => {
      nextWord();
      if (isPlaying) startTimer();
    });
    btnPrev.addEventListener('click', () => {
      prevWord();
      if (isPlaying) startTimer();
    });

    btnBlinkToggle.addEventListener('click', () => {
      blinkEnabled = !blinkEnabled;
      blinkStatus.textContent = blinkEnabled ? 'ON' : 'OFF';
      blinkStatus.className = blinkEnabled ? 'text-blue-400' : 'text-slate-500';
      renderWord();
    });

    // Atajos de teclado (Espacio para iniciar/pausar, flechas para navegar)
    document.addEventListener('keydown', (e) => {
      if (e.code === 'Space') {
        e.preventDefault();
        togglePlay();
      } else if (e.code === 'ArrowRight') {
        nextWord();
      } else if (e.code === 'ArrowLeft') {
        prevWord();
      }
    });

    // Render inicial
    renderWord();
  </script>
</body>
</html>
